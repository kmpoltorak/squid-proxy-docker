name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint Dockerfile (hadolint via Docker image)
        run: |
          echo "Running hadolint against squid/Dockerfile using hadolint Docker image"
          docker run --rm -i hadolint/hadolint:latest hadolint -f tty squid/Dockerfile || true

      - name: Lint shell scripts (install shellcheck)
        run: |
          echo "Installing shellcheck and linting shell scripts"
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck squid/entrypoint.sh || true
          shellcheck scripts/*.sh || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start compose
        run: |
          docker compose up --build -d

      - name: Wait for proxy port
        run: |
          echo "Waiting for proxy to accept connections on localhost:3128..."
          for i in $(seq 1 60); do
            if nc -z localhost 3128; then
              echo "Port open"
              exit 0
            fi
            sleep 1
          done
          echo "Timeout waiting for proxy port" >&2
          exit 1

      - name: Run proxy functional test
        env:
          PROXY_URL: http://localhost:3128
        run: |
          chmod +x ./scripts/test-proxy.sh
          ./scripts/test-proxy.sh

      - name: Tear down
        if: always()
        run: |
          docker compose down --remove-orphans
